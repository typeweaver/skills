name: Link check

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      # check-links.sh resolves relative links with marked before the HTTP pass.
      - run: pnpm install --frozen-lockfile
      - name: Check source links
        id: links
        run: |
          set +e
          ./scripts/check-links.sh > result.txt 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat result.txt
      - name: Open or update issue on failure
        if: steps.links.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Broken source links detected"
          body="$(printf 'The weekly link check found unreachable sources:\n\n```\n%s\n```\n' "$(cat result.txt)")"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
