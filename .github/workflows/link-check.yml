name: Link check

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check source links
        id: links
        run: |
          set +e
          ./scripts/check-links.sh > result.txt 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat result.txt
      - name: Open or update issue on failure
        if: steps.links.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Broken source links detected"
          body="$(printf 'The weekly link check found unreachable sources:\n\n```\n%s\n```\n' "$(cat result.txt)")"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
