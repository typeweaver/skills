version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      effect:
        patterns: ["effect", "@effect/*"]
      tooling:
        patterns: ["*"]
        exclude-patterns: ["effect", "@effect/*"]
