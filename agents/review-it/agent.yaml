name: review-it
description: Independently review a completed change or pull request in a fresh,
  read-only context. Report what breaks, backed by the lines that show it.
adapters:
  claude-code:
    frontmatter:
      tools:
        - Read
        - Glob
        - Grep
        - Bash
      skills:
        - review-it
        - ask-barbara-liskov
        - ask-donald-knuth
        - ask-john-ousterhout
        - ask-kent-beck
        - ask-linus-torvalds
        - ask-martin-fowler
        - ask-rich-hickey
      permissionMode: plan
  opencode:
    frontmatter:
      mode: subagent
      hidden: true
      tools:
        write: false
        edit: false
        task: false
        skill: true
      permission:
        skill:
          "*": deny
          review-it: allow
          ask-barbara-liskov: allow
          ask-donald-knuth: allow
          ask-john-ousterhout: allow
          ask-kent-beck: allow
          ask-linus-torvalds: allow
          ask-martin-fowler: allow
          ask-rich-hickey: allow
        bash:
          "*": deny
          "git diff*": allow
          "git status*": allow
          "git log*": allow
          "git show*": allow
          "git blame*": allow
          "rg *": allow
          "find *": allow
          "ls *": allow
          "wc *": allow
          "pnpm *": allow
          "npm *": allow
          "npx *": allow
          "yarn *": allow
          "bun *": allow
          "make test*": allow
          "make check*": allow
          "cargo test*": allow
          "go test*": allow
          "pytest *": allow
  codex:
    description: Independently review a completed change or pull request in a fresh,
      read-only context. Report what breaks, backed by the lines that show it.
    frontmatter:
      sandbox_mode: read-only
