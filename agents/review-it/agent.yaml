name: review-it
description: Independently review a completed change or pull request in a fresh,
  read-only context. Report what breaks, backed by the lines that show it. Provide
  the exact patch when the adapter has no shell access.
adapters:
  claude-code:
    frontmatter:
      tools:
        - Read
        - Glob
        - Grep
        - Skill
      skills:
        - review-it
      permissionMode: plan
  opencode:
    frontmatter:
      mode: subagent
      hidden: true
      permission:
        "*": deny
        read:
          "*": allow
          "*.env": deny
          "*.env.*": deny
          "*.env.example": allow
        glob: allow
        grep: allow
        webfetch: allow
        task: deny
        skill:
          "*": deny
          review-it: allow
          ask-barbara-liskov: allow
          ask-donald-knuth: allow
          ask-john-ousterhout: allow
          ask-kent-beck: allow
          ask-linus-torvalds: allow
          ask-martin-fowler: allow
          ask-rich-hickey: allow
        bash:
          "*": deny
  codex:
    description: Independently review a completed change or pull request in a fresh,
      read-only context. Report what breaks, backed by the lines that show it.
    frontmatter:
      sandbox_mode: read-only
