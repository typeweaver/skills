name: review-it
description: Independently review a completed change or pull request in a fresh,
  read-only context. Report what breaks, backed by the lines that show it.
adapters:
  claude-code:
    frontmatter:
      skills:
        - review-it
      permissionMode: plan
  opencode:
    frontmatter:
      mode: subagent
      hidden: true
      permission:
        edit: deny
        skill: allow
        bash: allow
  codex:
    description: Independently review a completed change or pull request in a fresh,
      read-only context. Report what breaks, backed by the lines that show it.
    frontmatter:
      sandbox_mode: read-only
